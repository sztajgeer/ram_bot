name: Sprawdź nowe ogłoszenia

on:
  schedule:
    # co godzinę, w pełnych godzinach (UTC) — GitHub czasem opóźnia trochę harmonogram.
    # Chcesz częściej? Zmień np. na "*/30 * * * *" (co 30 min), ale sprawdź w
    # Settings → Actions swojego repo ile minut/miesiąc masz jeszcze w limicie,
    # zanim zwiększysz częstotliwość — instalacja przeglądarki w każdym
    # uruchomieniu potrafi zjeść limit szybciej niż się wydaje. Repo publiczne
    # nie ma tego limitu wcale.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # pozwala odpalić ręcznie z zakładki Actions

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj zależności Pythona
        run: pip install -r requirements.txt

      - name: Zainstaluj przeglądarkę Playwright (Chromium)
        run: playwright install --with-deps chromium

      - name: Uruchom sprawdzenie ogłoszeń
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_listings.py

      - name: Zapisz stan (seen.json) z powrotem do repo
        run: |
          git config user.name "marketplace-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json
          git diff --quiet --cached || git commit -m "Aktualizacja stanu ogłoszeń"
          git push
